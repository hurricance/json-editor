name: Build and Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Package as zip
        run: |
          cd release
          zip -r ../json-editor-${{ github.ref_name }}.zip .
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v5
        with:
          name: json-editor-zip
          path: json-editor-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: json-editor-*.zip
          body: |
            Chrome extension: two-panel JSON editor with recursive formatting and bidirectional sync.
          make_latest: true
