<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Editor</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e94560;
      letter-spacing: 0.5px;
    }

    header span {
      font-size: 12px;
      color: #888;
    }

    main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .panel {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .divider {
      width: 4px;
      flex-shrink: 0;
      background: #0f3460;
      cursor: col-resize;
      transition: background 0.15s;
      position: relative;
    }

    .divider:hover,
    .divider.active {
      background: #e94560;
    }

    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 32px;
      border-radius: 1px;
      background: #ffffff33;
    }

    .divider:hover::after,
    .divider.active::after {
      background: #ffffff66;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status {
      font-size: 12px;
      min-height: 16px;
      transition: color 0.2s;
    }

    .status.success {
      color: #4caf50;
    }

    .status.error {
      color: #e94560;
    }

    .editor-body {
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .editor-body .cm-editor {
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>JSON Editor</h1>
    <span>Left: raw input &mdash; Right: formatted output (editable, syncs back)</span>
  </header>
  <main>
    <div class="panel" id="left-panel">
      <div class="panel-header">
        <h2>Input</h2>
        <span class="status" id="left-status"></span>
      </div>
      <div class="editor-body" id="left-editor"></div>
    </div>
    <div class="divider" id="divider"></div>
    <div class="panel" id="right-panel">
      <div class="panel-header">
        <h2>Formatted</h2>
        <span class="status" id="right-status"></span>
      </div>
      <div class="editor-body" id="right-editor"></div>
    </div>
  </main>
  <script src="dist/editor.js"></script>
</body>
</html>
