<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Editor</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e94560;
      letter-spacing: 0.5px;
    }

    header span {
      font-size: 12px;
      color: #888;
    }

    main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel:first-child {
      border-right: 1px solid #0f3460;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status {
      font-size: 12px;
      min-height: 16px;
      transition: color 0.2s;
    }

    .status.success {
      color: #4caf50;
    }

    .status.error {
      color: #e94560;
    }

    .editor-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .line-numbers {
      flex-shrink: 0;
      overflow: hidden;
      padding: 16px 0;
      background: #16162a;
      border-right: 1px solid #0f3460;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Menlo, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
      user-select: none;
      min-width: 44px;
    }

    .line-numbers span {
      display: block;
      padding-right: 10px;
      padding-left: 6px;
      color: #555;
      min-height: 20.8px; /* 13px * 1.6 */
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Menlo, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      background: #1a1a2e;
      color: #e0e0e0;
      tab-size: 2;
      overflow: auto;
      white-space: pre;
      overflow-wrap: normal;
    }

    textarea::placeholder {
      color: #555;
    }

    textarea:focus {
      background: #1e1e36;
    }

    /* Scrollbar */
    textarea::-webkit-scrollbar,
    .line-numbers::-webkit-scrollbar {
      width: 8px;
    }

    .line-numbers::-webkit-scrollbar {
      width: 0;
    }

    textarea::-webkit-scrollbar-track {
      background: transparent;
    }

    textarea::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>JSON Editor</h1>
    <span>Left: raw input &mdash; Right: formatted output (editable, syncs back)</span>
  </header>
  <main>
    <div class="panel">
      <div class="panel-header">
        <h2>Input</h2>
        <span class="status" id="left-status"></span>
      </div>
      <div class="editor-body">
        <div class="line-numbers" id="left-linenums"></div>
        <textarea id="left-editor" placeholder='Paste JSON here, e.g. {"name":"test","data":"{\"key\":\"value\"}"}' spellcheck="false" wrap="off"></textarea>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2>Formatted</h2>
        <span class="status" id="right-status"></span>
      </div>
      <div class="editor-body">
        <div class="line-numbers" id="right-linenums"></div>
        <textarea id="right-editor" placeholder="Formatted JSON will appear here..." spellcheck="false" wrap="off"></textarea>
      </div>
    </div>
  </main>
  <script src="editor.js"></script>
</body>
</html>
